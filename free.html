                                    {products
                                        .filter(item =>
                                            (!selectedRegion || item.region === selectedRegion) &&
                                            (!selectedCategory || item.category === selectedCategory)
                                        ).map((item) => (

                                            <div key={item.id}
                                                draggable
                                                onDragStart={(event) => handleDragStart(event, item.id)}>
                                                <FreeEdit
                                                    img={item.img}
                                                    img1={item.img1}
                                                    img2={item.img2}
                                                    p={item.p}
                                                    h2={item.h2}
                                                />
                                            </div>

                                        ))
                                    }
                                </div>
                            </div>
                            <div className="box-right">
                                <div className="title">
                                    <p>行程列表</p>
                                    <a href="./free-detail.itinerary.html"><img src="./images/icon/Vector.svg" alt="download" /></a>
                                </div>
                                {['第一天', '第二天', '第三天'].map((day, index) => (
                                    <div className="box-list" key={index}
                                        onDrop={(event) => handleDrop(event, index)}
                                        onDragOver={handleDragOver}>
                                        <h2>{day}</h2>
                                        <div className="content">
                                            {itinerary[index].map((product, i) => (
                                                <FreeEdit
                                                    key={i}
                                                    img={product.img}
                                                    h2={product.h2}
                                                    itInItinerary={true}
                                                    onDelete={() => handleDelete(product.id, index)}
                                                    itemId={product.id}
                                                    dayIndex={index}
                                                    setItinerary={setItinerary}
                                                />
                                            ))}
                                        </div>
                                    </div>
                                ))}
                                <div className="btn">
                                    <button onClick={addDay}>加入行程</button>
                                </div>
                                <div className="btn2">
                                    <a href="./shopping.html"><button>進入購物車<img src="./images/icon/Shopping cart.svg" alt="" /></button></a>
                                </div>
                            </div>
                        </section>


                    </main>
                    <Footer />
                </>
            )
        }
        ReactDOM
            .createRoot(document.getElementById('root'))
            .render(<App />);
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/index.js"></script>



</body>

</html>
