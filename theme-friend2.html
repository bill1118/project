<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關西旅遊網</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="./css/style-friend2.css">
    <script type="text/babel" src="./jsx/Topbar.jsx"></script>
    <script type="text/babel" src="./jsx/Footer.jsx"></script>
    <script type="text/babel" src="./jsx/ContainerJourney.jsx"></script>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            const products = [
                {
                    id: 1,
                    img: <img src="./images/4-theme-friend/pexels-satoshi-4058519.jpg" alt="大阪" />,
                    imgb: <img src="./images/4-theme-friend/food-1614130_640.jpg" alt="大阪" />,
                    imgs: <img src="./images/4-theme-friend/pexels-haugenzhays-1798631.jpg" alt="大阪" />,
                    h1: '大阪',
                    h2: '天守閣',
                    h3: '道頓堀',
                    h4: '加賀流',
                    h5: '第一天',
                },
                {
                    id: 2,
                    img: <img src="./images/4-theme-friend/pexels-satoshi-4058519.jpg" alt="大阪" />,
                    imgb: <img src="./images/4-theme-friend/pexels-satoshi-4058519.jpg" alt="大阪" />,
                    imgs: <img src="./images/4-theme-friend/pexels-satoshi-4058519.jpg" alt="大阪" />,
                    h1: '大阪',
                    h2: '天守閣',
                    h3: '道頓堀',
                    h4: '加賀流',
                    h5: '第一天',
                },
            ];
            return (
                <>
                    <Topbar />
                    <main>
                        <section id="container-banner">
                            <div className="layout-space"></div>
                            <div className="layout-list">
                                <figure></figure>
                                <div className="layout-table_list">
                                    <table>
                                        <tr>
                                            <th>出發時間</th>
                                            <th>售價</th>
                                            <th>狀態</th>
                                        </tr>
                                        <tr>
                                            <td>2024/09/27(五)</td>
                                            <td>$13,000起</td>
                                            <td><button>額滿</button></td>
                                        </tr>
                                        <tr>
                                            <td>2024/10/11(五)</td>
                                            <td>$15,000起</td>
                                            <td><button>額滿</button></td>
                                        </tr>
                                        <tr>
                                            <td>2024/11/08(五)</td>
                                            <td>$13,000起</td>
                                            <td><button>額滿</button></td>
                                        </tr>
                                        <tr>

                                        </tr>
                                    </table>
                                    <div className="content">
                                        <h2>好友樂悠遊</h2>
                                        <p>與朋友一起在京阪神收集回憶，</p>
                                        <p>帶上您的三五好友，</p>
                                        <p>計畫一次難忘的朋友之旅，</p>
                                        <p>無論是探索新城市、享受美食，</p>
                                        <p>還是一起挑戰極限，</p>
                                        <p>我們都能為您們安排充滿驚喜的旅程。</p>
                                    </div>
                                </div>
                            </div>
                            <div className="btn">
                                <figure></figure>
                                <button>報名行程</button>
                            </div>
                        </section>

                        {
                            products.map((item, index) => (
                                <React.Fragment key={item.id}>
                                    
                                        <ContainerJourney
                                            img={item.img}
                                            imgb={item.imgb}
                                            imgs={item.imgs}
                                            h1={item.h1}
                                            h2={item.h2}
                                            h3={item.h3}
                                            h4={item.h4}
                                            h5={item.h5}
                                        />
                                    

                                    {/* 在第一個產品和第二個產品之間插入新的 <section> */}
                                    {index === 0 && (
                                        <section className="additional-section">
                                            <h2>這是一個額外的區塊</h2>
                                            <p>這個區塊在第一個和第二個產品之間插入。</p>
                                        </section>
                                    )}
                                </React.Fragment>
                            ))
                        }
                    </main>

                    <Footer />





                </>
            )
        }




        ReactDOM
            .createRoot(document.getElementById('root'))
            .render(<App />);
    </script>


</body>

</html>
