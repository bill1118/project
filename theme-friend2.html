<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關西旅遊網</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="./style-friend2.css">
</head>

<body>
    <header id="container-topbar">
        <h1 class="logo">
            <a href="./index.html"><img src="./images/logo/Union-logo-brown 1.svg" alt="關西旅遊網logo"></a>
        </h1>
        <nav class="navigation">
            <ul class="menu">
                <li><a href="">主題行程</a></li>
                <li><a href="">自由編輯</a></li>
                <li><a href="">聯絡我們</a></li>
                <li><a href="">聯絡我們</a></li>
            </ul>
            <ul class="icon">
                <li><a class="icon-shoppingcar" href=""><img src="./images/icon/shoppingcar.png" alt="購物車"></a></li>
                <li><a class="icon-member" href=""><img src="./images/icon/User.png" alt="會員"></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="container-banner">
            <!-- <div class="layout-space"></div> -->
            <div class="layout-list">
                <figure>
                    <img src="../images/theme/friend.jpg" alt="朋友旅遊">
                </figure>
                <div class="layout-table_list">
                    <table>
                        <tr>
                            <th>出發時間</th>
                            <th>售價</th>
                            <th>狀態</th>
                        </tr>
                        <tr>
                            <td>2024/09/27(五)</td>
                            <td>$13,000起</td>
                            <td><button>額滿</button></td>
                        </tr>
                        <tr>
                            <td>2024/10/11(五)</td>
                            <td>$15,000起</td>
                            <td><button>額滿</button></td>
                        </tr>
                        <tr>
                            <td>2024/11/08(五)</td>
                            <td>$13,000起</td>
                            <td><button>額滿</button></td>
                        </tr>
                    </table>
                    <div class="content">
                        <h2>好友樂悠遊</h2>
                        <p>與朋友一起在京阪神收集回憶，</p>
                            <p>帶上您的三五好友，</p>
                            <p>計畫一次難忘的朋友之旅，</p>
                            <p>無論是探索新城市、享受美食，</p>
                            <p>還是一起挑戰極限，</p>
                            <p>我們都能為您們安排充滿驚喜的旅程。</p>
                    </div>
                </div>
            </div>
            <div class="btn">
                <figure></figure>
                <button>報名行程</button>
            </div>
        </section>

        <section id="container-journey">
            <div class="box-title">
                <div class="title-list">
                    <div class="title">
                        <h2>天守閣</h2>
                    </div>
                    <div class="title">
                        <h2>道頓堀</h2>
                    </div>
                    <div class="title">
                        <h2>甲賀流</h2>
                    </div>
                </div>
                <div class="content">
                    <h4>第一天</h4>
                </div>
            </div>
            <div class="box-primary">

            </div>
            <div class="box-second">
                
            </div>
        </section>
    </main>
</body>

</html>
