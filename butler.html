<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神火旅遊火火</title>
    <link rel="stylesheet" href="./css/butler.css">
</head>

<body>

    <!-- 耳機按鈕 -->
    <div class="icon-bar">
        <button id="butler" class="icon-button">
            <img src="./images//butler/butler.svg" alt="小幫手">
        </button>
    </div>

    <!-- 收合視窗 -->

    <div id="collapsible" class="collapsible">
        <div class="popup-header">
            <img src="./images//butler/logo-union-white.svg" alt="Logo" class="logo">
        </div>
        <div class="popup-body">
            <div class="message-row">
                <div class="circle-icon">
                    <img src="./images//butler/small-logo.svg" alt="對話頭像">
                </div>
                <div class="message-content">歡迎使用查詢服務！</div>
            </div>
            <div class="message-row">
                <div class="circle-icon">
                    <img src="./images//butler/small-logo.svg" alt="對話頭像">
                </div>
                <div class="message-content">您好！我是神火旅遊的小管家火火，歡迎隨時與我們聯繫！</div>
            </div>
            <!-- 放置在底部的輸入框和按鈕 -->
            <div class="input-container">
                <input type="text" placeholder="請讓我知道大阪的觀光景點">
                <button class="submit-button">
                    <img src="./images/butler/send 1.svg" alt="Icon" class="icon">
                </button>
            </div>
        </div>
    </div>
    

    <script src="./js/butler.js"></script>

</body>

</html>
