<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" src="./jsx/Topbar.jsx"></script>
    <script type="text/babel" src="./jsx/Footer.jsx"></script>
    <script type="text/babel" src="./jsx/BirthdaySelector.jsx"></script>
    <link rel="stylesheet" href="./css/style-member.css">
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            return (
                <>
                    <Topbar />
                    <main>
                        <section>
                            <div className="boxleft">
                                <div className="head">
                                    <img src="./images/icon/User.svg" alt="" />
                                    <p>shenhuo68</p>
                                </div>
                                <div className="vip">
                                    <img src="./images/icon/crown.svg" alt="" />
                                    <p>VIP1</p>
                                </div>
                                <div className="information">
                                    <a href="">
                                        <img src="./images/icon/users.svg" alt="" />
                                        <p>個人資料</p>
                                    </a>
                                </div>
                                <div className="account">
                                    <a href="">
                                        <img src="./images/icon/link.svg" alt="" />
                                        <p>帳戶綁定</p>
                                    </a>
                                </div>
                                <div className='order'>
                                    <a href="">
                                        <img src="./images/icon/ticket-alt.svg" alt="" />
                                        <p>訂單查詢</p>
                                    </a>
                                </div>
                                <div className='integral'>
                                    <a href="">
                                        <img src="./images/icon/ticket.svg" alt="" />
                                        <p>我的積分</p>
                                    </a>
                                </div>
                                <div className="signout">
                                    <a href="">
                                        <p>登出</p>
                                    </a>
                                </div>
                            </div>
                            <div className="boxright">
                                <div className="title">
                                    <h3>個人資料</h3>
                                    <span>為保護您的個資，僅用於提供個人化服務</span>
                                </div>
                                <div className="list">
                                    <form action="">
                                        <div className="title">
                                            <p>姓名</p>
                                            <label htmlFor="gender">性別</label>
                                            <p>電子郵件</p>
                                            <p>電話號碼</p>
                                            <label htmlFor="year">生日</label>
                                        </div>
                                        <div className="content">
                                            <div className="name">
                                                <p>QQ</p>
                                                <button>變更</button>
                                            </div>
                                            <div className="gender">
                                                <div>男<input type="radio" name="gender" defaultValue="genderm" /></div>
                                                <div>女<input type="radio" name="gender" defaultValue="genderw" /></div>
                                                <div>不公開<input type="radio" name="gender" defaultValue="gendero" /></div>
                                            </div>
                                            <div className="mail">
                                                <p>shenhuo68@shtravel.com.tw</p>
                                                <button>變更</button>
                                            </div>
                                            <div className="tel">
                                                <p>09+68-686868</p>
                                                <button>變更</button>
                                            </div>
                                            <div className="birthday">
                                                <select id="year" name="year" onClick={() => {
                                                    const yearSelect = document.getElementById('year');
                                                    const currentYear = new Date().getFullYear();
                                                    const startYear = 1950; // 可根據需要更改起始年份

                                                    for (let year = currentYear; year >= startYear; year--) {
                                                        const option = document.createElement('option');
                                                        option.value = year;
                                                        option.textContent = year;
                                                        yearSelect.appendChild(option);
                                                    }

                                                }}>
                                                    <option defaultValue="option">選擇年分</option>
                                                </select>

                                                <BirthdaySelector/>

                                                <select id="day" name="day" onClick={() => {
                                                    const yearSelect = document.getElementById('day');
                                                    const currentYear = new Date().getFullYear();
                                                    const startYear = 1950; // 可根據需要更改起始年份

                                                    for (let year = currentYear; year >= startYear; year--) {
                                                        const option = document.createElement('option3');
                                                        option.value = year;
                                                        option.textContent = year;
                                                        yearSelect.appendChild(option);
                                                    }

                                                }}>
                                                    <option defaultValue="option3">選擇日期</option>
                                                </select>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </section >
                    </main >
                    <Footer />
                </>
            )
        }

        ReactDOM
            .createRoot(document.getElementById('root'))
            .render(<App />);
    </script>
    
</body>

</html>
