<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關西旅遊網</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="stylesheet" href="./css/carousel.css">
    <link rel="stylesheet" href="./css/style.css">

    <script type="text/babel" src="./jsx/Topbar.jsx"></script>
    <script type="text/babel" src="./jsx/Footer.jsx"></script>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useEffect } = React;
        function App() {
            useEffect(() => {
                const member = document.getElementById('member');
                member.addEventListener('click', () => {
                    document.getElementById('loginPopup').style.display = 'block';
                })

                const close = document.getElementById('closePopup')
                close.addEventListener('click', () => {
                    document.getElementById('loginPopup').style.display = 'none';
                });

            });

            return (
                <React.Fragment>

                    <Topbar />
                    
                    <main>
                        <section id="container-banner">
                            <img src="./images/topbar-background.png" alt="banner" />
                            <div className="slide">
                                <ul className="list-1">
                                    <li className="item">
                                    </li>
                                    <li className="item">
                                    </li>
                                    <li className="item">
                                    </li>
                                    {/*新增重播*/}
                                    <li className="item">
                                    </li>
                                </ul>
                            </div>
                            <div className="slide-text">
                                <ul className="list-2">
                                    <li className="item-text"></li>
                                    <li className="item-text"></li>
                                    <li className="item-text"></li>
                                    <li className="item-text"></li>
                                </ul>
                            </div>
                        </section>
                        <section id="container-topics">
                            <header className="title">
                                <h2>主題行程</h2>
                            </header>
                            <div className="more-info">
                                <a href="">了解行程</a>
                            </div>
                            <div class="box-list">
                                <div className="item">
                                    <a href="">
                                        <figure><img src="./images/theme/family.jpeg" alt="家族出遊" /></figure>
                                        <div className="content">
                                            <h3>家族出遊</h3>
                                            <p>與家人共度每好時光</p>
                                        </div>
                                    </a>
                                </div>
                                <div className="item">
                                    <a href="./theme-friend.html">
                                        <figure><img src="./images/theme/friend.jpg" alt="朋友出遊" /></figure>
                                        <div className="content">
                                            <h3>朋友出遊</h3>
                                            <p>與朋友一起收集回憶</p>
                                        </div>
                                    </a>
                                </div>
                                <div className="item">
                                    <a href="">
                                        <figure><img src="./images/theme/food.jpeg" alt="美食旅遊" /></figure>
                                        <div className="content">
                                            <h3>美食之旅</h3>
                                            <p>品味當地的特色美食</p>
                                        </div>
                                    </a>
                                </div>
                            </div>
                        </section>
                        <section id="container-free">
                            <header className="title">
                                <h2>自由規劃</h2>
                            </header>
                            <div className="item">
                                <figure><img className="layout-1" src="./images/free/freecompress-pexels-ruiz-2450697.jpg" alt="" /></figure>
                                <figure><img src="./images/free/freecompress-pexels-balazsimon-16226405.jpg" alt="" /></figure>
                                <figure><img src="./images/free/freecompress-pexels-eko-cahyono-102048560-9831406.jpg" alt="" /></figure>
                                <figure><img src="./images/free/tianshu-liu-SBK40fdKbAg-unsplash.jpg" alt="" /></figure>
                                <figure><img className="layout-2" src="./images/free/freecompress-pexels-victor-3770955-5589991.jpg" alt="" /></figure>
                            </div>
                            <div className="more-info">
                                <a href="./free.html">查看更多</a>
                            </div>
                        </section>
                        <section id="container-partner">
                            <header className="title">
                                <h2>合作夥伴</h2>
                            </header>
                            <div className="icon-list">
                                <div className="icon">
                                    <img src="./images/logo/logo 1.svg" alt="" />
                                </div>
                                <div className="icon">
                                    <img src="./images/logo/logo-2.svg" alt="" />
                                </div>
                                <div className="icon">
                                    <img src="./images/logo/logo-3.svg" alt="" />
                                </div>
                                <div className="icon">
                                    <img src="./images/logo/logo-4.svg" alt="" />
                                </div>
                                <div className="icon">
                                    <img src="./images/logo/logo-5.svg" alt="" />
                                </div>
                                <div className="icon">
                                    <img src="./images/logo/logo-6.svg" alt="" />
                                </div>
                            </div>
                        </section>
                    </main>
                    <Footer />
                </React.Fragment>
            )
        }
        ReactDOM
            .createRoot(document.getElementById('root'))
            .render(<App />);
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/carousel.js"></script>
    <script src="./js/index.js"></script>



</body>

</html>
