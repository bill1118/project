<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彈跳視窗</title>
    <link rel="stylesheet" href="./css/introduce.css">
</head>

<body>

    
    <button id="openModalBtn">+</button>

    <!-- 弹跳视窗 -->
    <div id="myModal" class="modal">
        <!-- 弹跳视窗内容 -->
        <div class="modal-content">
            <div class="img_L">
                <img src="./images/introduce/usj-1914942_1000.jpg" alt="">
            </div>
            <div class="inf_R">
                <span class="close">×</span>
                <div class="write">
                    <h2>環球影城</h2>
                    <hr>
                    <div class="icon">
                        <img src="./images/introduce/map-marker.png">
                        <p>&nbsp;大阪</p>
                    </div>
                    <p>簡介:</p>
                    <p>是一座大型主題樂園，於2001年開幕，擁有多個受歡迎的主題區和遊樂設施。</p>
                    <br>
                    <p>營業時間:08:00-22:00</p>
                    <br>
                    <p>地址:</p>
                    <p>大阪府大阪市此花區櫻島二丁目1番33號</p>
                    <br>
                    <p>電話：0570+123+123</p>
                    <br>
                    <p>門票：NT$1,500元</p>
                    <br>
                    <label for="date">選擇日期&人數:</label>
                </div>
                <form action="" name="form-date" id="form-date" title="選人數">
                    <input type="date" name="date" id="date" title="date" placeholder="請選擇日期">
                    <div class="quantity">
                        <button class="minus">-</button>
                        <input type="text" value="1" min="1">
                        <button class="plus">+</button>
                    </div>                    
                    <div class="btn">
                        <button type="submit" name="btn__contact--submit" id="btn__contact--submit"
                            title="送出按鈕"><span>加入行程</span></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="./js/introduce.js"></script>
</body>

</html>
